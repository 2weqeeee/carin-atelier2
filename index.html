<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carin Atelier | Costurería & Moldes Digitales</title>
    <meta name="description" content="Carin Atelier - Tienda de moldes digitales, clases de costura y confección a medida en Alta Gracia, Córdoba.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧵</text></svg>">
</head>
<body>
    <div id="announcement-container"></div>
    <div id="header-container"></div>
    
    <canvas id="bg-canvas" style="position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-2; pointer-events:none;"></canvas>
    
    <main id="main-content">
        <!-- SPA Content injected here -->
        <div style="height: 100vh; display: flex; align-items: center; justify-content: center;">
            <div class="logo" style="font-size: 3rem; animation: pulse 2s infinite;">Carin Atelier</div>
        </div>
    </main>
    
    <div id="footer-container"></div>

    <!-- Side Cart -->
    <div id="cart-overlay" class="cart-overlay" onclick="App.toggleCart()">
        <div class="side-cart" onclick="event.stopPropagation()">
            <div class="cart-header">
                <h2>Tu Carrito</h2>
                <button onclick="App.toggleCart()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">×</button>
            </div>
            <div id="cart-items" class="cart-items"></div>
            <div id="cart-coupon-area" style="padding:0 1.5rem; display:none;"></div>
            <div class="cart-footer">
                <div style="display:flex; justify-content:space-between; margin-bottom:1rem; font-weight:700; font-size:1.2rem;">
                    <span>Total:</span>
                    <span id="cart-total">$0</span>
                </div>
                <button class="btn btn-dark" style="width:100%" onclick="App.checkout()">Confirmar Compra</button>
            </div>
        </div>
    </div>

    <!-- Toasts -->
    <div id="toast-container" class="toast-container"></div>

    <style>
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Scripts -->
    <script src="db.js" charset="UTF-8"></script>
    <script src="app.js" charset="UTF-8"></script>
</body>
</html>
